workflow: {name: GraphListenerParity, dataType: IxIFlow.Generators.Tests.ParityData}
definitions:
  - kind: stateMachine
    id: machine
    start: pending
    states:
      - key: pending
        transitions:
          - {activity: IxIFlow.Generators.Tests.GraphBlocked, to: end}
          - on: go
            event: IxIFlow.Generators.Tests.Answer
            to: end
            steps:
              - kind: activity
                activity: IxIFlow.Generators.Tests.ParityEcho
                input: [{target: Value, from: {path: previousStep.Value}}]
                output: [{source: Value, to: {path: workflow.Result}}]
