{
  "workflow": {
    "name": "Assigneach",
    "dataType": "IxIFlow.Tests.Conformance.AssignScenarios+Data"
  },
  "definitions": [
    {
      "kind": "forEach",
      "items": {
        "path": "workflow.Items"
      },
      "as": "item",
      "steps": [
        {
          "kind": "assign",
          "to": {
            "path": "workflow.Items[index(item)]"
          },
          "value": {
            "kind": "binary",
            "operator": "add",
            "left": {
              "path": "item"
            },
            "right": {
              "kind": "constant",
              "value": 1
            }
          }
        },
        {
          "kind": "assign",
          "to": {
            "path": "workflow.Count"
          },
          "value": {
            "kind": "binary",
            "operator": "add",
            "left": {
              "path": "workflow.Count"
            },
            "right": {
              "kind": "constant",
              "value": 1
            }
          },
          "id": "assign"
        },
        {
          "kind": "activity",
          "activity": "IxIFlow.Tests.Conformance.AssignScenarios+Boundary"
        },
        {
          "kind": "waitFor",
          "key": "saved",
          "event": "IxIFlow.Tests.Conformance.AssignScenarios+Go"
        },
        {
          "kind": "assign",
          "to": {
            "path": "workflow.Count"
          },
          "value": {
            "kind": "binary",
            "operator": "add",
            "left": {
              "path": "workflow.Count"
            },
            "right": {
              "kind": "constant",
              "value": 1
            }
          }
        }
      ]
    }
  ]
}
