{
  "workflow": {
    "name": "ThrowConformanceeach",
    "dataType": "IxIFlow.Tests.Conformance.ThrowScenarios+Data"
  },
  "code": {
    "raise": {
      "language": "csharp-expression",
      "source": "new IxIFlow.Tests.Conformance.ThrowScenarios.BusinessError(\"private\") { Code = item }"
    }
  },
  "definitions": [
    {
      "kind": "try",
      "steps": [
        {
          "kind": "forEach",
          "items": {
            "path": "workflow.Items"
          },
          "as": "item",
          "parallel": {
            "maxConcurrency": 2
          },
          "steps": [
            {
              "kind": "throw",
              "exception": "IxIFlow.Tests.Conformance.ThrowScenarios+BusinessError",
              "value": {
                "kind": "function",
                "function": "raise"
              }
            }
          ]
        }
      ],
      "catches": [
        {
          "exception": "IxIFlow.Tests.Conformance.ThrowScenarios+BusinessError",
          "faultType": "IxIFlow.Tests.Conformance.ThrowScenarios+CodeFault",
          "steps": [
            {
              "kind": "waitFor",
              "key": "handler",
              "event": "IxIFlow.Tests.Conformance.ThrowScenarios+Go"
            },
            {
              "kind": "activity",
              "activity": "IxIFlow.Tests.Conformance.ThrowScenarios+Read",
              "input": [
                {
                  "target": "Value",
                  "from": {
                    "path": "fault.Code"
                  }
                }
              ],
              "output": [
                {
                  "source": "Value",
                  "to": {
                    "path": "workflow.Value"
                  }
                }
              ]
            }
          ]
        }
      ]
    }
  ]
}
