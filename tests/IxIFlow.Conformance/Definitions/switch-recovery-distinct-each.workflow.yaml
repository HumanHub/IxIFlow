workflow: {name: SwitchDistinctCompositioneach, dataType: IxIFlow.Tests.Conformance.SwitchScenarios+Data}
definitions:
- {kind: activity, activity: IxIFlow.Tests.Conformance.SwitchScenarios+Seed}
- kind: forEach
  items: {path: workflow.Items}
  as: item
  parallel: {maxConcurrency: 2}
  steps:
  - kind: switch
    value: {path: item}
    cases:
    - value: {kind: constant, value: 1}
      steps:
      - {kind: activity, activity: IxIFlow.Tests.Conformance.SwitchScenarios+Forward, input: [{target: Text, from: {kind: constant, value: one}}]}
      - {kind: waitFor, key: one, event: IxIFlow.Tests.Conformance.SwitchScenarios+Go}
    default:
    - {kind: activity, activity: IxIFlow.Tests.Conformance.SwitchScenarios+Forward, input: [{target: Text, from: {kind: constant, value: two}}]}
    - {kind: waitFor, key: two, event: IxIFlow.Tests.Conformance.SwitchScenarios+Go}
