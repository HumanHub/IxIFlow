{
  "workflow": {
    "name": "ThrowConformancesaga",
    "dataType": "IxIFlow.Tests.Conformance.ThrowScenarios+Data"
  },
  "code": {
    "raise": {
      "language": "csharp-expression",
      "source": "new IxIFlow.Tests.Conformance.ThrowScenarios.BusinessError(\"private\") { Code = 73 }"
    }
  },
  "definitions": [
    {
      "kind": "saga",
      "steps": [
        {
          "kind": "throw",
          "exception": "IxIFlow.Tests.Conformance.ThrowScenarios+BusinessError",
          "value": {
            "kind": "function",
            "function": "raise"
          }
        }
      ],
      "onError": [
        {
          "exception": "IxIFlow.Tests.Conformance.ThrowScenarios+BusinessError",
          "faultType": "IxIFlow.Tests.Conformance.ThrowScenarios+CodeFault",
          "steps": [
            {
              "kind": "waitFor",
              "key": "handler",
              "event": "IxIFlow.Tests.Conformance.ThrowScenarios+Go"
            },
            {
              "kind": "activity",
              "activity": "IxIFlow.Tests.Conformance.ThrowScenarios+Read",
              "input": [
                {
                  "target": "Value",
                  "from": {
                    "path": "fault.Code"
                  }
                }
              ],
              "output": [
                {
                  "source": "Value",
                  "to": {
                    "path": "workflow.Value"
                  }
                }
              ]
            }
          ],
          "compensate": "all",
          "then": "continue"
        }
      ]
    }
  ]
}
