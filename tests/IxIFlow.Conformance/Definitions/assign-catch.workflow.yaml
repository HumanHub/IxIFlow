{
  "workflow": {
    "name": "Assigncatch",
    "dataType": "IxIFlow.Tests.Conformance.AssignScenarios+Data"
  },
  "definitions": [
    {
      "kind": "try",
      "steps": [
        {
          "kind": "activity",
          "activity": "IxIFlow.Tests.Conformance.AssignScenarios+Fail"
        }
      ],
      "catches": [
        {
          "exception": "System.InvalidOperationException",
          "faultType": "IxIFlow.Tests.Conformance.AssignScenarios+Fault",
          "steps": [
            {
              "kind": "assign",
              "to": {
                "path": "workflow.Text"
              },
              "value": {
                "path": "fault.Message"
              }
            },
            {
              "kind": "assign",
              "to": {
                "path": "workflow.Count"
              },
              "value": {
                "kind": "binary",
                "operator": "add",
                "left": {
                  "path": "workflow.Count"
                },
                "right": {
                  "kind": "constant",
                  "value": 1
                }
              },
              "id": "assign"
            },
            {
              "kind": "activity",
              "activity": "IxIFlow.Tests.Conformance.AssignScenarios+Boundary"
            },
            {
              "kind": "waitFor",
              "key": "saved",
              "event": "IxIFlow.Tests.Conformance.AssignScenarios+Go"
            },
            {
              "kind": "assign",
              "to": {
                "path": "workflow.Count"
              },
              "value": {
                "kind": "binary",
                "operator": "add",
                "left": {
                  "path": "workflow.Count"
                },
                "right": {
                  "kind": "constant",
                  "value": 1
                }
              }
            }
          ]
        }
      ]
    }
  ]
}
